<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 240" width="830" height="240" role="img" aria-label="About me">
  <style>
    .g1{stop-color:#2D2230} .g2{stop-color:#222737}
    .glass{fill:#fff;fill-opacity:.07;stroke:#fff;stroke-opacity:.22}
    .title{fill:#F3DCE7} .body{fill:#DCC9D4}
    text{font-family:"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop class="g1" offset="0"/><stop class="g2" offset="1"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <clipPath id="clip"><rect width="830" height="240" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="830" height="240" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle cx="90" cy="200" r="70" fill="#BA829B" opacity=".5"/>
      <circle cx="760" cy="40" r="70" fill="#8E99AD" opacity=".45"/>
    </g>
  </g>

  <rect class="glass" x="30" y="20" width="770" height="200" rx="18" stroke-width="1.5"/>
  <line class="glass" x1="30" y1="58" x2="800" y2="58" stroke-width="1.5"/>
  <circle cx="56" cy="39" r="5" fill="#BA829B"/>
  <circle cx="76" cy="39" r="5" fill="#E8B4CC"/>
  <circle cx="96" cy="39" r="5" fill="#8E99AD"/>
  <text class="title" x="120" y="44" font-size="14" font-weight="700">♡ ABOUT_ME.TXT</text>

  <g class="body" font-size="14">
    <text x="56" y="94">I'm a Computer Science student focused on building practical software</text>
    <text x="56" y="118">and exploring how AI can make systems more adaptive, secure, and</text>
    <text x="56" y="142">intelligent.</text>
    <text x="56" y="178">I enjoy working across the stack: from data analysis and machine</text>
    <text x="56" y="202">learning models to backend architecture and defensive security.</text>
  </g>
</svg>
