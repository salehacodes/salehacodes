  <line class="glass" x1="40" y1="64" x2="790" y2="64" stroke-width="1.5"/>
  <circle cx="66" cy="46" r="5" fill="#BA829B"/>
  <circle cx="86" cy="46" r="5" fill="#E8B4CC"/>
  <circle cx="106" cy="46" r="5" fill="#8E99AD"/>
