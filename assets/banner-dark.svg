<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 220" width="830" height="220" role="img" aria-label="salehacodes banner">
  <style>
    .g1{stop-color:#2A1F2B} .g2{stop-color:#1F2433}
    .glass{fill:#fff;fill-opacity:.07;stroke:#fff;stroke-opacity:.22}
    .title{fill:#F3DCE7} .sub{fill:#CDB8C4}
    text{font-family:"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}
  </style>
  <defs>
