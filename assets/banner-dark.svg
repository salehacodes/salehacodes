      <circle cx="150" cy="60" r="70" fill="#BA829B" opacity=".55"/>
      <circle cx="700" cy="170" r="80" fill="#8E99AD" opacity=".5"/>
      <circle cx="430" cy="210" r="50" fill="#E8B4CC" opacity=".6"/>
    </g>
  </g>

